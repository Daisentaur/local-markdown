<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — MarkItDown</title>
<style>
  :root { --bg:#0f1117; --panel:#171a23; --border:#2a2f3c; --text:#e6e8ee; --muted:#9aa1b1; --accent:#6ea8fe; --accent2:#4d7fe0; --err:#f87171; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .card { width:340px; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:28px; }
  h1 { font-size:18px; margin:0 0 4px; }
  p.sub { color:var(--muted); font-size:13px; margin:0 0 20px; }
  label { display:block; font-size:12px; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border); background:#0f1117; color:var(--text); font-size:14px; }
  input:focus { outline:none; border-color:var(--accent); }
  button { width:100%; margin-top:20px; padding:11px; border:none; border-radius:8px; background:var(--accent2); color:#fff; font-size:14px; font-weight:600; cursor:pointer; }
  button:hover { background:var(--accent); }
  .err { color:var(--err); font-size:13px; margin-top:14px; min-height:18px; }
</style>
</head>
<body>
  <form class="card" method="POST" action="/login">
    <h1>MarkItDown</h1>
    <p class="sub">Sign in to continue</p>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autofocus />
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" />
    <button type="submit">Sign in</button>
    <div class="err">{{ERROR}}</div>
  </form>
</body>
</html>
