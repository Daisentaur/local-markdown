<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MarkItDown — file to Markdown converter</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a23; --panel2: #1e222d; --border: #2a2f3c;
    --text: #e6e8ee; --muted: #9aa1b1; --accent: #6ea8fe; --accent2: #4d7fe0;
    --ok: #4ade80; --err: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  header a.logout { color: var(--muted); font-size: 13px; text-decoration: none; border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; display: none; }
  header a.logout:hover { border-color: var(--accent); color: var(--text); }
  .wrap { flex: 1; display: flex; min-height: 0; }
  .left { width: 340px; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .right { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .drop {
    margin: 16px; padding: 32px 16px; border: 2px dashed var(--border); border-radius: 12px;
    text-align: center; color: var(--muted); cursor: pointer; transition: .15s;
  }
  .drop:hover, .drop.over { border-color: var(--accent); color: var(--text); background: var(--panel); }
  .drop strong { color: var(--accent); }

  .filelist { flex: 1; overflow-y: auto; padding: 0 12px; }
  .fileitem {
    padding: 10px 12px; border-radius: 8px; margin-bottom: 6px; background: var(--panel);
    display: flex; align-items: center; gap: 10px; cursor: pointer; border: 1px solid transparent;
  }
  .fileitem:hover { border-color: var(--border); }
  .fileitem.active { border-color: var(--accent); background: var(--panel2); }
  .fileitem .nm { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.ok { background: var(--ok); } .dot.err { background: var(--err); } .dot.pending { background: var(--muted); }

  .actions { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    background: var(--accent2); color: #fff; border: none; padding: 9px 14px; border-radius: 8px;
    font-size: 13px; cursor: pointer; font-weight: 500;
  }
  button:hover { background: var(--accent); }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button.ghost:hover { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: not-allowed; }

  .toolbar {
    padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center;
    gap: 8px; justify-content: space-between;
  }
  .toolbar .name { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tabs { display: flex; gap: 4px; }
  .tab { padding: 5px 12px; font-size: 12px; border-radius: 6px; cursor: pointer; color: var(--muted); }
  .tab.active { background: var(--panel2); color: var(--text); }

  .view { flex: 1; overflow: auto; min-height: 0; }
  pre.raw { margin: 0; padding: 20px 24px; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; line-height: 1.6; }
  .preview { padding: 20px 28px; line-height: 1.6; max-width: 820px; }
  .preview h1,.preview h2,.preview h3 { border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .preview table { border-collapse: collapse; }
  .preview td, .preview th { border: 1px solid var(--border); padding: 6px 10px; }
  .preview code { background: var(--panel2); padding: 2px 5px; border-radius: 4px; }
  .preview pre { background: var(--panel2); padding: 12px; border-radius: 8px; overflow: auto; }
  .preview img { max-width: 100%; }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  .errbox { margin: 20px; padding: 14px; border: 1px solid var(--err); border-radius: 8px; color: var(--err); font-size: 13px; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--muted); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>MarkItDown</h1>
  <span class="sub">upload files → convert to Markdown → download</span>
  <span class="spacer"></span>
  <a class="logout" id="logout" href="/logout">Log out</a>
</header>
<div class="wrap">
  <div class="left">
    <div class="drop" id="drop">
      <div>Drop files here or <strong>browse</strong></div>
      <div style="font-size:12px;margin-top:6px">PDF · Word · PowerPoint · Excel · HTML · images · audio · CSV · JSON · zip</div>
    </div>
    <input type="file" id="fileInput" multiple hidden />
    <div class="filelist" id="filelist"></div>
    <div class="actions">
      <button id="convertBtn" disabled>Convert</button>
      <button class="ghost" id="zipBtn" disabled>Download all (.zip)</button>
      <button class="ghost" id="clearBtn" disabled>Clear</button>
    </div>
  </div>
  <div class="right">
    <div class="toolbar">
      <span class="name" id="activeName">No file selected</span>
      <div style="display:flex;gap:12px;align-items:center">
        <div class="tabs">
          <div class="tab active" data-mode="preview" id="tabPreview">Preview</div>
          <div class="tab" data-mode="raw" id="tabRaw">Markdown</div>
        </div>
        <button class="ghost" id="dlBtn" disabled>Download .md</button>
      </div>
    </div>
    <div class="view" id="view"><div class="empty">Add files and hit Convert to see the Markdown here.</div></div>
  </div>
</div>

<script src="/static/marked.min.js"></script>
<script>
const AUTH = {{AUTH}};
if (AUTH) document.getElementById("logout").style.display = "inline-block";

const state = { files: [], active: -1, mode: "preview" };
const $ = id => document.getElementById(id);

const drop = $("drop"), fileInput = $("fileInput");
drop.addEventListener("click", () => fileInput.click());
["dragover","dragenter"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => addFiles(e.dataTransfer.files));
fileInput.addEventListener("change", e => addFiles(e.target.files));

function addFiles(fl) {
  for (const f of fl) state.files.push({ file: f, name: f.name, markdown: null, error: null, status: "pending" });
  render();
}

function render() {
  const list = $("filelist");
  list.innerHTML = "";
  state.files.forEach((f, i) => {
    const el = document.createElement("div");
    el.className = "fileitem" + (i === state.active ? " active" : "");
    el.innerHTML = `<span class="dot ${f.status}"></span><span class="nm"></span>`;
    el.querySelector(".nm").textContent = f.name;
    el.onclick = () => { state.active = i; renderView(); render(); };
    list.appendChild(el);
  });
  const has = state.files.length > 0;
  const anyDone = state.files.some(f => f.status === "ok");
  $("convertBtn").disabled = !has;
  $("clearBtn").disabled = !has;
  $("zipBtn").disabled = !anyDone;
}

$("clearBtn").onclick = () => { state.files = []; state.active = -1; render(); renderView(); };

$("convertBtn").onclick = async () => {
  const btn = $("convertBtn");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  const fd = new FormData();
  const pending = state.files.filter(f => f.status !== "ok");
  pending.forEach(f => fd.append("files", f.file, f.name));
  try {
    const res = await fetch("/api/convert", { method: "POST", body: fd });
    if (res.status === 401) { window.location = "/login"; return; }
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    let ri = 0;
    for (const f of pending) {
      const r = data.results[ri++];
      f.markdown = r.markdown; f.error = r.error; f.outName = r.name;
      f.status = r.error ? "err" : "ok";
    }
    if (state.active === -1 && state.files.length) state.active = 0;
  } catch (e) {
    alert("Conversion request failed: " + e.message);
  }
  btn.innerHTML = "Convert";
  render(); renderView();
};

function currentActive() { return state.active >= 0 ? state.files[state.active] : null; }

function renderView() {
  const f = currentActive();
  const view = $("view");
  $("activeName").textContent = f ? f.name : "No file selected";
  $("dlBtn").disabled = !(f && f.status === "ok");
  if (!f) { view.innerHTML = '<div class="empty">Add files and hit Convert to see the Markdown here.</div>'; return; }
  if (f.status === "pending") { view.innerHTML = '<div class="empty">Not converted yet — hit Convert.</div>'; return; }
  if (f.status === "err") { view.innerHTML = ""; const b=document.createElement("div"); b.className="errbox"; b.textContent="Could not convert this file. "+f.error; view.appendChild(b); return; }
  if (state.mode === "raw") {
    const pre = document.createElement("pre"); pre.className = "raw"; pre.textContent = f.markdown;
    view.innerHTML = ""; view.appendChild(pre);
  } else {
    const div = document.createElement("div"); div.className = "preview";
    div.innerHTML = window.marked ? marked.parse(f.markdown) : f.markdown;
    view.innerHTML = ""; view.appendChild(div);
  }
}

$("tabPreview").onclick = () => { state.mode = "preview"; $("tabPreview").classList.add("active"); $("tabRaw").classList.remove("active"); renderView(); };
$("tabRaw").onclick = () => { state.mode = "raw"; $("tabRaw").classList.add("active"); $("tabPreview").classList.remove("active"); renderView(); };

$("dlBtn").onclick = () => {
  const f = currentActive(); if (!f || f.status !== "ok") return;
  downloadText(f.outName || (f.name.replace(/\.[^.]+$/, "") + ".md"), f.markdown);
};

$("zipBtn").onclick = async () => {
  const done = state.files.filter(f => f.status === "ok")
    .map(f => ({ name: f.outName || (f.name.replace(/\.[^.]+$/, "") + ".md"), markdown: f.markdown }));
  const res = await fetch("/api/zip", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ files: done }) });
  if (res.status === 401) { window.location = "/login"; return; }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "markdown.zip"; a.click();
  URL.revokeObjectURL(url);
};

function downloadText(name, text) {
  const blob = new Blob([text], { type: "text/markdown" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

render();
</script>
</body>
</html>
